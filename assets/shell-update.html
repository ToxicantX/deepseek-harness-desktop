<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shell 更新</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; background: #f5f6f8; color: #202124; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; }
    main { min-height: 220px; padding: 30px 32px 26px; display: flex; flex-direction: column; justify-content: center; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: 0; }
    #version { margin: 5px 0 22px; color: #5f6368; font-size: 13px; }
    .progress-row { display: grid; grid-template-columns: minmax(0, 1fr) 52px; align-items: center; gap: 14px; }
    progress { width: 100%; height: 8px; accent-color: #1677ff; }
    #percent { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }
    .metrics { margin-top: 12px; display: flex; justify-content: space-between; gap: 20px; color: #5f6368; font-size: 12px; font-variant-numeric: tabular-nums; }
    .amount { min-width: 0; overflow-wrap: anywhere; }
    #total::before { content: " / "; }
    #total:empty::before { content: ""; }
    #status { margin: 20px 0 0; color: #3c4043; font-size: 13px; }
  </style>
</head>
<body id="shell-update-page">
  <main>
    <h1>正在更新 DeepSeek Harness</h1>
    <p id="version">Shell 更新</p>
    <div class="progress-row">
      <progress id="progress" max="100" value="0"></progress>
      <p id="percent">0%</p>
    </div>
    <div class="metrics">
      <span class="amount"><span id="transferred">0 B</span><span id="total">0 B</span></span>
      <span id="speed">0 B/s</span>
    </div>
    <p id="status">正在连接更新服务...</p>
  </main>
</body>
</html>
